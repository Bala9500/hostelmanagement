<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Murugan Hostel - Login</title>
        <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:linear-gradient(135deg, #0f172a, #1e3a8a, #2563eb);
            overflow: hidden;
        }
        body::before {
            content: "";
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            top: -120px;
            left: -100px;
            animation: moveCircle 6s ease-in-out infinite alternate;
        }
        body::after {
            content: "";
            position: absolute;
            width: 280px;
            height: 280px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            bottom: -100px;
            right: -70px;
            animation: moveCircle 7s ease-in-out infinite alternate;
        }
        @keyframes moveCircle {
            from {transform: translateY(0);}
            to {transform: translateY(30px);}
        }
        .login-container {
            width: 400px;
            padding: 45px 40px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 20px;
            box-shadow:0 20px 50px rgba(0, 0, 0, 0.25);
            text-align: center;
            position: relative;
            z-index: 2;
            transition: 0.4s;
        }
        .login-container:hover {
            transform: translateY(-8px);
            box-shadow: 0 28px 60px rgba(0, 0, 0, 0.30);
        }
        .hostel-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #2563eb;
            color: white;
            border-radius: 18px;
            font-size: 32px;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.30);
            transition: 0.3s;
        }
        .hostel-icon:hover {
            transform:rotate(-5deg)scale(1.08);
        }
        h1 {
            color: #0f172a;
            font-size: 28px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .welcome-text {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .input-group {
            text-align: left;
        }
        .input-group label {
            display: block;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .input-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            background: #f8fafc;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #2563eb;
            background: white;
            box-shadow:0 0 0 4px rgba(37, 99, 235, 0.12);
            transform: translateY(-2px);
        }
        .login-btn {
            width: 100%;
            padding: 13px;
            margin-top: 5px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #1d4ed8;
            transform: translateY(-3px);
            box-shadow:0 8px 20px rgba(37, 99, 235, 0.35);
        }
        .login-btn:active {
            transform: scale(0.97);
        }
        .signup-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            font-size: 14px;
            color: #64748b;
        }
        .signup-section a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
            margin-left: 5px;
            transition: 0.3s;
        }
        .signup-section a:hover {
            color: #1e3a8a;
            text-decoration: underline;
        }
        @media (max-width: 500px) {
            .login-container {
                width: 90%;
                padding: 35px 25px;
            }
            h1 {
                font-size: 24px;
            }
        }
    </style>
    </head>
    <body>
        <div class="login-container">
            <div class="hostel-icon">M</div>
            <h1>MURUGAN HOSTEL</h1>
            <p class="welcome-text">Welcome back! Please login to continue</p>
            <form method="post">
                {% csrf_token %}
                <div class="input-group">
                    <label>Username</label>
                    <input type="text"name="username"placeholder="Enter your username" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="login-btn"> Login</button>
            </form>
            <div class="signup-section">
                <span> Don't have an account? </span>
                <a href="signup">Sign Up</a>
            </div>
        </div>
    </body>
    </html>
