<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        body {
            min-height: 100vh;
            background:linear-gradient( 135deg, #0f172a,  #1e3a8a, #2563eb);
            color: white;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            top: -170px;
            left: -120px;
            z-index: 0;
        }

        body::after {
            content: "";
            position: fixed;
            width: 350px;
            height: 350px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            bottom: -150px;
            right: -100px;
            z-index: 0;
        }

        .navbar {
            width: 100%;
            height: 75px;
            padding: 0 7%;
            display: flex;
            justify-content:space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.95);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.20);
            position: relative;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
        }


        .brand-logo {
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #2563eb;
            color: white;
            border-radius: 12px;
            font-size: 22px;
            font-weight: bold;
            box-shadow:0 5px 15px rgba(37, 99, 235, 0.35);
            transition: 0.3s;
        }
        .brand:hover .brand-logo {
            transform:rotate(-5deg)scale(1.08);
        }
        .brand h2 {
            font-size: 20px;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            list-style: none;
        }

        .nav-links a {
            display: block;
            padding: 10px 15px;
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: white;
            background: #2563eb;
            transform:translateY(-2px);
        }

        .nav-links .active {
            color: white;
            background: #2563eb;
        }

        .nav-links .logout {
            margin-left: 10px;
            border:1px solid rgba(255,255,255,0.25);
        }

        .nav-links .logout:hover {
            background: #dc2626;
            border-color: #dc2626;
        }
        .menu-btn {
            display: none;
            background: transparent;
            border: none;
            color: white;
            font-size: 27px;
            cursor: pointer;
        }


        main {
            width: 90%;
            max-width: 1050px;
            margin: auto;
            min-height:calc(100vh - 75px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 2;
            padding: 60px 0;
        }

        .contact-heading {
            text-align: center;
            margin-bottom: 40px;
        }

        .contact-heading h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .contact-heading p {
            color: #bfdbfe;
            font-size: 15px;
        }

        .contact-heading h1::after {
            content: "";
            display: block;
            width: 60px;
            height: 4px;
            margin:12px auto 0;
            background: #60a5fa;
            border-radius: 10px;
        }

        .contact-container {
            display: grid;
            grid-template-columns:repeat(3, 1fr);
            gap: 22px;
        }

        .contact-card {
            background: rgba(255,255,255,0.96);
            padding: 35px 25px;
            border-radius: 18px;
            text-align: center;
            color: #334155;
            box-shadow:0 15px 35px rgba(0,0,0,0.18);
            transition: 0.3s;
        }
        .contact-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 22px 40px rgba(0,0,0,0.25);
        }

        .contact-icon {
            width: 60px;
            height: 60px;
            margin:0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #dbeafe;
            color: #2563eb;
            border-radius: 15px;
            font-size: 27px;
            transition: 0.3s;
        }
        .contact-card:hover
        .contact-icon {
            background: #2563eb;
            color: white;
            transform:scale(1.08);
        }

        .contact-card h4 {
            color: #0f172a;
            font-size: 19px;
            margin-bottom: 12px;
            text-transform: capitalize;
        }

        .contact-card p {
            color: #64748b;
            font-size: 14px;
            line-height: 1.8;
        }

        .background-logo {
            position: fixed;
            right: 5%;
            bottom: -60px;
            color: rgba(255,255,255,0.04);
            font-size: 350px;
            font-weight: bold;
            z-index: 1;
            user-select: none;
        }

        @media(max-width: 800px) {
            .menu-btn {
                display: block;
            }
            .nav-links {
                position: absolute;
                top: 75px;
                left: 0;
                width: 100%;
                display: none;
                flex-direction: column;
                padding: 20px;
                background: #0f172a;
            }

            .nav-links.show {
                display: flex;
            }

            .nav-links li {
                width: 100%;
            }

            .nav-links a {
                width: 100%;
                text-align: center;
            }

            .nav-links .logout {
                margin-left: 0;
            }

            .contact-container {
                grid-template-columns: 1fr;
                max-width: 500px;
                margin: auto;
                width: 100%;
            }
        }

        @media(max-width: 500px) {
            .navbar {
                padding: 0 5%;
            }
            .brand h2 {
                font-size: 16px;
            }

            .brand-logo {
                width: 40px;
                height: 40px;
            }

            .contact-heading h1 {
                font-size: 32px;
            }
            main {
                padding: 45px 0;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
                <a href="{% url 'home' %}" class="brand">

                </a>

                <ul class="nav-links"id="navLinks">
                    <li><a href="{% url 'home' %}">Home</a></li>
                    <li><a href="{% url 'report' %}">Report</a></li>
                    <li><a href="{% url 'contact' %}">Contact</a></li>
                    <li><a href="{% url 'about' %}"class="active">About</a></li>
                    <li><a href="{% url 'logout' %}"class="logout">Logout</a></li>
                </ul>
            </nav>
            <main>
                <div class="contact-heading">
                    <h1>CONTACT</h1>
                    <p>Get in touch with Murugan Hostel</p>
                </div>
                <div class="contact-container">
                    <div class="contact-card">
                        <div class="contact-icon">☎</div>
                        <h4>phone</h4>
                        <p>9500377048</p>
                        <p>9942959440</p>
                    </div>
                    <div class="contact-card">
                        <div class="contact-icon">✉</div>
                        <h4>gmail</h4>
                        <p>muruganhosel@gmail.com</p>
                        <p>balasekar9500@gmail.com</p>
                    </div>
                    <div class="contact-card">
                        <div class="contact-icon">⌖</div>
                        <h4>address</h4>
                        <p>155, kamarajar nagar</p>
                        <p>padikuppam main road</p>
                        <p>koyambedu</p>
                        <p>chennai-600040</p>
                    </div>
                </div>
            </main>
            <div class="background-logo">
                M
            </div>
            <script>
            function toggleMenu() {
                const navLinks =document.getElementById("navLinks");
                navLinks.classList.toggle("show");
            }
            </script>
</body>
</html>
